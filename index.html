<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AfroCurl Clarity — Hair Product Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --indigo:#2E2875;--indigo2:#3d35a0;--mauve:#bc61a6;--teal:#2da8af;--gold:#D4AF37;--cream:#F7F4F0;
  --bg:#F7F4F0;--surface:#fff;--text:#1a1a2e;--text2:#555;--border:#e0daf5;
  --radius:14px;--shadow:0 2px 18px rgba(46,40,117,.10);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0d1f;--surface:#1a1733;--text:#f0eeff;--text2:#b0acd4;--border:#2e2860;--cream:#1a1733;
  }
}
[data-theme="dark"]{--bg:#0f0d1f;--surface:#1a1733;--text:#f0eeff;--text2:#b0acd4;--border:#2e2860;--cream:#1a1733;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif}
a{color:var(--teal);text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}

/* NAV */
.nav{display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-brand{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:700;color:var(--indigo);white-space:nowrap;margin-right:8px}
.nav-btn{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap;transition:all .2s;border:1.5px solid transparent}
.nav-btn:hover,.nav-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.nav-end{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:16px;border:1.5px solid var(--border)}

/* LAYOUT */
.page{max-width:700px;margin:0 auto;padding:24px 16px 80px}
.page-wide{max-width:900px;margin:0 auto;padding:0 0 80px}

/* CARDS */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;color:var(--indigo);margin-bottom:12px}

/* HERO */
.hero{background:linear-gradient(135deg,var(--indigo) 0%,#4a3d9e 50%,var(--mauve) 100%);color:#fff;padding:60px 24px 48px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero::after{content:'';position:absolute;bottom:-60px;left:-30px;width:250px;height:250px;border-radius:50%;background:rgba(212,175,55,.08)}
.hero-title{font-size:2.4rem;font-weight:700;line-height:1.2;margin-bottom:16px;position:relative;z-index:1}
.hero-title em{color:#E8D5F0;font-style:italic}
.hero-sub{font-size:1.05rem;opacity:.9;max-width:560px;margin:0 auto 32px;position:relative;z-index:1;line-height:1.6}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.btn-primary{background:var(--gold);color:#1a1a2e;padding:13px 28px;border-radius:28px;font-weight:600;font-size:15px;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,175,55,.4)}
.btn-outline{background:transparent;color:#fff;padding:13px 28px;border-radius:28px;font-weight:500;font-size:15px;border:2px solid rgba(255,255,255,.5);cursor:pointer;transition:all .2s}
.btn-outline:hover{background:rgba(255,255,255,.15)}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:20px}

/* FEATURES STRIP */
.features-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.feature-item{padding:24px 20px;text-align:center;border-right:1px solid var(--border)}
.feature-item:last-child{border-right:none}
.feature-icon{font-size:28px;margin-bottom:8px}
.feature-label{font-size:13px;font-weight:600;color:var(--indigo);margin-bottom:4px}
.feature-desc{font-size:12px;color:var(--text2);line-height:1.5}

/* TABS */
.tabs{display:flex;border-radius:12px;overflow:hidden;border:1.5px solid var(--border);margin-bottom:20px}
.tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:500;color:var(--text2);background:var(--surface);cursor:pointer;transition:all .2s;border:none}
.tab.active{background:var(--indigo);color:#fff}

/* FORM */
input[type=text],textarea,select{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
input[type=text]:focus,textarea:focus{border-color:var(--indigo)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px;margin-top:16px}
.form-hint{font-size:12px;color:var(--text2);margin-top:6px}

/* PILLS */
.pill-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid var(--border);color:var(--text2);cursor:pointer;transition:all .2s;background:var(--surface)}
.pill:hover{border-color:var(--indigo);color:var(--indigo)}
.pill.selected{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.pill.multi.selected{background:var(--mauve);border-color:var(--mauve)}

/* SCORE */
.score-ring-wrap{text-align:center;padding:24px 0}
.score-circle{width:120px;height:120px;border-radius:50%;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
.score-number{font-family:'Cormorant Garamond',serif;font-size:2.8rem;line-height:1}
.score-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.8}
.score-tier{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;color:var(--indigo)}

/* PETALS */
.petals-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.petal-card{background:var(--bg);border-radius:10px;padding:14px;border:1.5px solid var(--border)}
.petal-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mauve);margin-bottom:6px}
.petal-bar-wrap{background:var(--border);border-radius:4px;height:6px;overflow:hidden;margin-bottom:8px}
.petal-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .8s ease}
.petal-note{font-size:12px;color:var(--text2);line-height:1.5}

/* INGREDIENTS */
.ingredient-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ing-chip{padding:5px 12px;border-radius:12px;font-size:12px;font-weight:500;cursor:default}
.ing-good{background:#e6f9f0;color:#1a7a4a;border:1px solid #b3e8cc}
.ing-caution{background:#fff8e6;color:#7a5c1a;border:1px solid #ffe0a3}
.ing-neutral{background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.ing-info{background:#e8eeff;color:#2d3a8c;border:1px solid #c5cfff}

/* ALERTS */
.alert{padding:14px 16px;border-radius:10px;font-size:13px;line-height:1.6;margin-bottom:16px}
.alert-warn{background:#fff8e6;border:1.5px solid #ffd166;color:#7a5c1a}
.alert-info{background:#e8f4ff;border:1.5px solid #90caf9;color:#1a4a7a}
.alert-success{background:#e6f9f0;border:1.5px solid #81c784;color:#1a5c34}
.alert-error{background:#ffeef0;border:1.5px solid #ef9a9a;color:#7a1a2a}

/* LOADING */
.loading-pulse{background:linear-gradient(90deg,var(--border) 25%,var(--bg) 50%,var(--border) 75%);background-size:200% 100%;animation:pulse 1.5s infinite;border-radius:8px;height:14px;margin-bottom:8px}
@keyframes pulse{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading-card{padding:20px}
.loading-card .loading-pulse:nth-child(2){width:70%}
.loading-card .loading-pulse:nth-child(3){width:85%}
.loading-card .loading-pulse:nth-child(4){width:60%}

/* SCAN STATES */
.scan-status{padding:14px 16px;border-radius:10px;font-size:14px;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.scan-status.scanning{background:#e8f4ff;border:1.5px solid #90caf9;color:#1a4a7a}
.scan-status.success{background:#e6f9f0;border:1.5px solid #81c784;color:#1a5c34}
.scan-status.partial{background:#fff8e6;border:1.5px solid #ffd166;color:#7a5c1a}
.scan-status.error{background:#ffeef0;border:1.5px solid #ef9a9a;color:#7a1a2a}
.spinner{width:18px;height:18px;border:2.5px solid rgba(0,0,0,.15);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* PHOTO */
.photo-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px}
.photo-zone:hover{border-color:var(--indigo);background:rgba(46,40,117,.04)}
.photo-zone img{max-width:100%;max-height:280px;border-radius:10px;margin-bottom:12px;display:block;margin:0 auto 12px}
.photo-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* PLANNER */
.planner-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px}
.planner-score{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;min-width:44px;text-align:center}
.planner-info{flex:1;min-width:0}
.planner-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.planner-brand{font-size:12px;color:var(--mauve)}
.planner-date{font-size:11px;color:var(--text2);margin-top:2px}
.planner-actions{display:flex;gap:8px}

/* ROUTINE */
.routine-step{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.routine-step-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--indigo);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-name{font-weight:600;font-size:14px;flex:1}
.step-count{font-size:12px;color:var(--teal);font-weight:500}
.routine-step-body{padding:0 16px 16px;display:none}
.routine-step-body.open{display:block}
.routine-product{padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:13px}
.routine-product-name{font-weight:600;margin-bottom:2px}
.routine-meta{font-size:11px;color:var(--text2)}

/* COMPARE */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:500px){.compare-grid{grid-template-columns:1fr}}
.compare-score{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:700;text-align:center;padding:16px;border-radius:10px;margin-bottom:12px}

/* BADGES */
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:all .2s}
.badge-card.earned{border-color:var(--gold);box-shadow:0 2px 12px rgba(212,175,55,.2)}
.badge-icon{font-size:32px;margin-bottom:8px}
.badge-name{font-size:12px;font-weight:600;color:var(--indigo);margin-bottom:4px}
.badge-desc{font-size:11px;color:var(--text2)}
.badge-locked{opacity:.45;filter:grayscale(1)}

/* GLOSSARY */
.glossary-item{border-bottom:1px solid var(--border);padding:14px 0}
.glossary-item:last-child{border-bottom:none}
.glossary-term{font-weight:600;font-size:14px;color:var(--indigo);margin-bottom:4px}
.glossary-def{font-size:13px;color:var(--text2);line-height:1.6}
.glossary-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;margin-right:4px;margin-bottom:4px}

/* FOOTER */
.footer{background:var(--indigo);color:rgba(255,255,255,.8);text-align:center;padding:24px 16px;font-size:12px}
.footer-links{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:12px}
.footer-links a{color:rgba(255,255,255,.7);font-size:13px;transition:color .2s}
.footer-links a:hover{color:#fff}
.footer-note{opacity:.5;font-size:11px;margin-top:8px}

@media(max-width:600px){
  .hero-title{font-size:1.7rem}
  .features-strip{grid-template-columns:1fr}
  .feature-item{border-right:none;border-bottom:1px solid var(--border)}
  .feature-item:last-child{border-bottom:none}
  .petals-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ============================================================
// STATE
// ============================================================
const state = {
  screen: 'landing',
  profile: null,
  scanTab: 'name',
  scanResult: null,
  scanStatus: null, // null | 'scanning' | 'fetching' | 'done' | 'error'
  scanMsg: '',
  photoDataUrl: null,
  plannerItems: [],
  routineItems: [],
  compareIds: [],
  openRoutineStep: null,
  darkMode: false,
  glossarySearch: '',
};

function loadState(){
  try{
    const p = localStorage.getItem('acc_profile'); if(p) state.profile = JSON.parse(p);
    const pl = localStorage.getItem('acc_planner'); if(pl) state.plannerItems = JSON.parse(pl);
    const r = localStorage.getItem('acc_routine'); if(r) state.routineItems = JSON.parse(r);
    const d = localStorage.getItem('acc_dark'); if(d) state.darkMode = d==='1';
  }catch(e){}
}
function saveProfile(){ try{localStorage.setItem('acc_profile',JSON.stringify(state.profile))}catch(e){} }
function savePlanner(){ try{localStorage.setItem('acc_planner',JSON.stringify(state.plannerItems))}catch(e){} }
function saveRoutine(){ try{localStorage.setItem('acc_routine',JSON.stringify(state.routineItems))}catch(e){} }
function saveDark(){ try{localStorage.setItem('acc_dark',state.darkMode?'1':'0')}catch(e){} }

// ============================================================
// ROUTING
// ============================================================
function go(screen){
  state.screen = screen;
  if(screen==='scanner'){
    state.scanResult = null;
    state.scanStatus = null;
    state.scanMsg = '';
    state.photoDataUrl = null;
  }
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================
// RENDER
// ============================================================
function render(){
  document.body.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
  const app = document.getElementById('app');
  const s = state.screen;
  if(s==='landing') app.innerHTML = renderLanding();
  else if(s==='scanner') app.innerHTML = renderScanner();
  else if(s==='profile') app.innerHTML = renderProfile();
  else if(s==='planner') app.innerHTML = renderPlanner();
  else if(s==='routine') app.innerHTML = renderRoutine();
  else if(s==='compare') app.innerHTML = renderCompare();
  else if(s==='badges') app.innerHTML = renderBadges();
  else if(s==='glossary') app.innerHTML = renderGlossary();
  else if(s==='result') app.innerHTML = renderResult();
  bindEvents();
}

// ============================================================
// NAV
// ============================================================
function navHTML(active){
  const tabs = [
    {id:'scanner',label:'Scan'},
    {id:'profile',label:'Profile'},
    {id:'planner',label:'Planner'},
    {id:'routine',label:'Routine'},
    {id:'compare',label:'Compare'},
    {id:'badges',label:'Badges'},
    {id:'glossary',label:'Glossary'},
  ];
  return `<nav class="nav">
    <div class="nav-brand" onclick="go('landing')" style="cursor:pointer">AfroCurl<br/>Clarity</div>
    ${tabs.map(t=>`<button class="nav-btn${active===t.id?' active':''}" onclick="go('${t.id}')">${t.label}</button>`).join('')}
    <div class="nav-end">
      <button class="icon-btn" onclick="toggleDark()" title="Toggle dark mode">${state.darkMode?'☀️':'🌙'}</button>
    </div>
  </nav>`;
}

function toggleDark(){ state.darkMode = !state.darkMode; saveDark(); render(); }

// ============================================================
// LANDING
// ============================================================
function renderLanding(){
  const profileBanner = state.profile ? `
    <div class="card" style="display:flex;align-items:center;gap:14px;margin-bottom:24px;border-color:var(--indigo2)">
      <div style="font-size:28px">✨</div>
      <div>
        <div style="font-weight:600;color:var(--indigo);font-size:14px">Welcome back</div>
        <div style="font-size:13px;color:var(--text2)">${state.profile.porosity} porosity · ${state.profile.texture} hair · Profile saved</div>
      </div>
      <button class="btn-primary btn-sm" style="margin-left:auto" onclick="go('scanner')">Scan Now</button>
    </div>` : '';

  return `
    ${navHTML('landing')}
    <div class="page-wide">
      <div class="hero">
        <h1 class="hero-title">From confusion to clarity.<br/><em>From trial-and-error to informed decisions.</em></h1>
        <p class="hero-sub">Scan any hair product. Understand what it actually does for your hair. Get a personalised Crown Score™ based on your unique hair profile.</p>
        <div class="hero-actions">
          <button class="btn-primary" onclick="go('scanner')">📷 Scan a Product</button>
          <button class="btn-outline" onclick="go('profile')">Build My Crown Profile</button>
        </div>
      </div>
      <div class="features-strip">
        <div class="feature-item">
          <div class="feature-icon">🔍</div>
          <div class="feature-label">Instant Scan</div>
          <div class="feature-desc">Search by name, scan a barcode, or photograph the label — AI reads it for you</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">👑</div>
          <div class="feature-label">Crown Score™</div>
          <div class="feature-desc">Personalised 0–100 score shaped around your unique hair profile</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">📋</div>
          <div class="feature-label">Build Your Routine</div>
          <div class="feature-desc">Save products, track what works, and build a routine that's yours</div>
        </div>
      </div>
      <div class="page">
        ${profileBanner}
        ${!state.profile ? `<div class="alert alert-info">👋 Start by building your <strong>Crown Profile</strong> — it takes 2 minutes and makes every scan personalised to you.<br/><br/><button class="btn-primary btn-sm" onclick="go('profile')">Build My Profile</button></div>` : ''}
        <div class="card">
          <div class="card-title">What is AfroCurl Clarity?</div>
          <p style="font-size:14px;color:var(--text2);line-height:1.7">Powered by the <strong>PETALS™ Method</strong> — a structured framework built on hair science, not trends. Every Crown Score™ uses a personalised, multi-factor analysis to consider how a product may align with your current hair profile, needs and goals.</p>
          <div style="margin-top:12px;font-size:12px;color:var(--text2)">Built by <strong>The Afro Curly Hair Coach</strong> — 14+ years of textured hair expertise. <a href="https://www.theafrocurlyhaircoach.com" target="_blank">Learn more →</a></div>
        </div>
      </div>
    </div>
    ${renderFooter()}`;
}

// ============================================================
// SCANNER
// ============================================================
function renderScanner(){
  const tabs = ['By Name','Barcode','Photo'];
  const tabKeys = ['name','barcode','photo'];

  let tabContent = '';
  if(state.scanTab==='name'){
    tabContent = `
      <label>Search by product name or brand</label>
      <div style="display:flex;gap:8px;margin-top:6px">
        <input type="text" id="nameInput" placeholder="e.g. Shea Moisture Curl Enhancing Smoothie" style="flex:1"/>
        <button class="btn-primary btn-sm" onclick="doNameSearch()">Search</button>
      </div>
      <div class="form-hint">AI will find the product and fetch its full ingredient list automatically</div>`;
  } else if(state.scanTab==='barcode'){
    tabContent = `
      <label>Enter barcode number</label>
      <div style="display:flex;gap:8px;margin-top:6px">
        <input type="text" id="barcodeInput" placeholder="e.g. 764302246288" inputmode="numeric"/>
        <button class="btn-primary btn-sm" onclick="doBarcodeSearch()">Search</button>
      </div>
      <div class="form-hint">Enter the barcode number shown under the barcode lines on the packaging</div>`;
  } else {
    tabContent = `
      <div class="photo-zone" id="photoZone" onclick="triggerPhotoInput()">
        ${state.photoDataUrl
          ? `<img src="${state.photoDataUrl}" alt="Label photo"/><div style="font-size:13px;color:var(--text2);margin-top:8px">Photo uploaded — scanning with AI...</div>`
          : `<div style="font-size:40px;margin-bottom:8px">📷</div>
             <div style="font-weight:600;font-size:14px;margin-bottom:6px">Photograph the ingredients label</div>
             <div style="font-size:13px;color:var(--text2)">Good lighting · all text visible · no shadows</div>`}
      </div>
      <div class="photo-btns">
        <button class="btn-primary" onclick="triggerPhotoCapture()">📸 Take Photo</button>
        <button class="btn-outline" style="color:var(--indigo);border-color:var(--indigo)" onclick="triggerPhotoInput()">🖼️ Upload Image</button>
      </div>

function setScanTab(tab){ state.scanTab = tab; state.scanResult = null; state.scanStatus = null; state.scanMsg = ''; render(); }

// ---- NAME SEARCH ----
async function doNameSearch(){
  const q = (document.getElementById('nameInput')||{}).value||'';
  if(!q.trim()) return;
  state.scanStatus = 'scanning';
  state.scanMsg = 'Finding product...';
  state.scanResult = null;
  render();
  try{
    const res = await fetch('/.netlify/functions/search',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:q.trim(), mode:'search'})
    });
    const data = await res.json();
    if(data.found && data.product_name){
      state.scanResult = data;
      state.scanStatus = data.ingredients ? 'done' : 'partial';
      state.scanMsg = data.ingredients ? '' : 'Product found but ingredients were not available — please paste them below.';
    } else {
      state.scanStatus = 'error';
      state.scanMsg = 'Product not found. Try a different name or check spelling.';
    }
  } catch(e){
    state.scanStatus = 'error';
    state.scanMsg = 'Search failed. Please check your connection and try again.';
  }
  render();
}

// ---- BARCODE SEARCH ----
async function doBarcodeSearch(){
  const q = (document.getElementById('barcodeInput')||{}).value||'';
  if(!q.trim()) return;
  state.scanStatus = 'scanning';
  state.scanMsg = 'Looking up barcode...';
  state.scanResult = null;
  render();
  // Try Open Beauty Facts first for barcode
  try{
    const obfRes = await fetch(`https://world.openbeautyfacts.org/api/v0/product/${encodeURIComponent(q.trim())}.json`);
    const obfData = await obfRes.json();
    if(obfData.status===1 && obfData.product){
      const p = obfData.product;
      const name = p.product_name||p.product_name_en||'';
      const brand = p.brands||'';
      const ings = p.ingredients_text||p.ingredients_text_en||'';
      if(name){
        if(ings){
          state.scanResult = {found:true, product_name:name, brand:brand, product_type:'', ingredients:ings, confidence:'high'};
          state.scanStatus = 'done';
          render();
          return;
        } else {
          // Have product name, fetch ingredients via AI
          state.scanMsg = 'Product found — fetching ingredient list...';
          state.scanStatus = 'fetching';
          render();
          const aiRes = await fetch('/.netlify/functions/search',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({query: `${brand} ${name}`.trim(), mode:'ingredients_only'})
          });
          const aiData = await aiRes.json();
          state.scanResult = {
            found:true,
            product_name:name,
            brand:brand,
            product_type:'',
            ingredients:aiData.ingredients||'',
            confidence:aiData.confidence||'medium'
          };
          state.scanStatus = state.scanResult.ingredients ? 'done' : 'partial';
          state.scanMsg = state.scanResult.ingredients ? '' : 'Product found but ingredients not available — please paste them.';
          render();
          return;
        }
      }
    }
  } catch(e){}

  // Fallback to AI search with barcode as query
  try{
    const res = await fetch('/.netlify/functions/search',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:`barcode ${q.trim()}`, mode:'search'})
    });
    const data = await res.json();
    if(data.found && data.product_name){
      state.scanResult = data;
      state.scanStatus = data.ingredients ? 'done' : 'partial';
      state.scanMsg = data.ingredients ? '' : 'Product found but ingredients not available.';
    } else {
      state.scanStatus = 'error';
      state.scanMsg = 'Barcode not found. Try searching by product name instead.';
    }
  } catch(e){
    state.scanStatus = 'error';
    state.scanMsg = 'Search failed. Try searching by product name.';
  }
  render();
}

// ---- PHOTO SCAN ----
function triggerPhotoInput(){ document.getElementById('photoFileInput').click(); }
function triggerPhotoCapture(){ document.getElementById('photoCaptureInput').click(); }

function handlePhotoFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    state.photoDataUrl = e.target.result;
    state.scanStatus = 'scanning';
    state.scanMsg = 'Reading your label with AI...';
    state.scanResult = null;
    render();
    await doPhotoScan(e.target.result, file.type);
  };
  reader.readAsDataURL(file);
}

async function doPhotoScan(dataUrl, mimeType){
  try{
    // Extract base64 from data URL
    const base64 = dataUrl.split(',')[1];
    const mediaType = mimeType||'image/jpeg';

    const res = await fetch('/.netlify/functions/vision',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:base64, mediaType:mediaType})
    });
    const data = await res.json();

    if(data.error && !data.product_name){
      state.scanStatus = 'error';
      state.scanMsg = data.error;
      render();
      return;
    }

    if(data.product_name && data.ingredients_found && data.ingredients){
      // Perfect — got everything from the photo
      state.scanResult = {
        found:true,
        product_name:data.product_name,
        brand:data.brand||'',
        product_type:data.product_type||'',
        ingredients:data.ingredients,
        confidence:data.confidence||'medium',
        source:'photo'
      };
      state.scanStatus = 'done';
      state.scanMsg = '';
      render();
    } else if(data.product_name){
      // Got name but not full ingredients — auto-search for them regardless of flag
      state.scanMsg = `Found "${data.product_name}" — fetching ingredient list...`;
      state.scanStatus = 'fetching';
      render();

      const searchQuery = `${data.brand||''} ${data.product_name}`.trim();
      const aiRes = await fetch('/.netlify/functions/search',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query:searchQuery, mode:'ingredients_only'})
      });
      const aiData = await aiRes.json();

      state.scanResult = {
        found:true,
        product_name:data.product_name,
        brand:data.brand||aiData.brand||'',
        product_type:data.product_type||aiData.product_type||'',
        ingredients:aiData.ingredients||'',
        confidence:aiData.confidence||'low',
        source:'photo+ai'
      };
      state.scanStatus = state.scanResult.ingredients ? 'done' : 'partial';
      state.scanMsg = state.scanResult.ingredients ? '' : 'Product identified but ingredients not found — please paste them below.';
      render();
    } else {
      // Couldn't read the label clearly
      state.scanStatus = 'partial';
      state.scanMsg = 'The label was not clear enough to read fully. Try better lighting, hold steady, and make sure the ingredient list is visible. Or search by name instead.';
      render();
    }
  } catch(e){
    state.scanStatus = 'error';
    state.scanMsg = 'Photo scan failed. Try searching by product name instead.';
    render();
  }
}

function scoreTier(s){
  if(s>=85) return {tier:'Excellent Match',color:'#1a7a4a',bg:'#e6f9f0',desc:'Highly aligned with your current hair profile.'};
  if(s>=65) return {tier:'Good Match',color:'#2d3a8c',bg:'#e8eeff',desc:'Generally supportive, with some considerations depending on how you use it.'};
  if(s>=40) return {tier:'Use with Awareness',color:'#7a5c1a',bg:'#fff8e6',desc:'A mixed fit. Some ingredients may support your hair while others may need more mindful use.'};
  return {tier:'Poor Match',color:'#7a1a2a',bg:'#ffeef0',desc:'This formulation may be less aligned with your current hair profile and needs.'};
}

async function requestCrownAnalysis(){
  if(!state.scanResult||!state.scanResult.ingredients) return false;
  state.scanStatus='scanning'; state.scanMsg='Analysing this product against your Crown Profile...'; render();
  try{
    const res=await fetch('/.netlify/functions/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ingredients:state.scanResult.ingredients,profile:state.profile})});
    const data=await res.json();
    if(!res.ok||data.error) throw new Error(data.error||'Analysis failed');
    state.scoreAnalysis=data; state.scanStatus=null; state.screen='result'; render(); return true;
  }catch(e){
    state.scanStatus='error'; state.scanMsg='We could not complete the Crown Score right now. Please try again.'; state.screen='scanner'; render(); return false;
  }
}

async function scoreCurrent(){ return requestCrownAnalysis(); }
async function scoreManual(){
  const manual=(document.getElementById('manualIngredients')||{}).value||'';
  if(!manual.trim()) return;
  if(!state.scanResult) state.scanResult={product_name:'Unknown Product',brand:''};
  state.scanResult.ingredients=manual.trim();
  return requestCrownAnalysis();
}

        ${!state.profile?'<div class="alert alert-info" style="margin-top:14px;text-align:left">👤 <strong>This is a general score.</strong> Build your Crown Profile for an analysis shaped around your hair characteristics and needs.</div>':''}
      </div>
      ${factors.length?`<div class="card"><div class="card-title">Why this score?</div><div style="font-size:13px;color:var(--text2);line-height:1.7">This Crown Score™ reflects how the formulation aligns with your current profile. Key factors included:</div><ul style="margin:10px 0 0 20px;font-size:13px;color:var(--text2);line-height:1.7">${factors.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}

      ${caution.length?`<div class="card"><div class="card-title">⚠️ Ingredients to Use with Awareness</div><div class="ingredient-list">${caution.map(x=>`<span class="ing-chip ing-caution" title="${x.effect||''}">${x.name}</span>`).join('')}</div><div style="font-size:12px;color:var(--text2);margin-top:10px">These are not automatically “bad” ingredients. Their suitability depends on your profile, the full formulation, how much is present, and how often the product is used.</div></div>`:''}

function saveToPlannerFromResult(){
  if(!state.scanResult||!state.scoreAnalysis) return;
  const r=state.scanResult, score=state.scoreAnalysis.score;
  const exists=state.plannerItems.find(p=>p.product_name===r.product_name&&p.brand===r.brand);
  if(!exists){state.plannerItems.unshift({id:Date.now().toString(),product_name:r.product_name,brand:r.brand||'',product_type:r.product_type||'',ingredients:r.ingredients,score,date:new Date().toLocaleDateString('en-GB')});savePlanner();}
  go('planner');
}

function renderProfile(){
  const f = state.profile || {};
  const q = [
    {label:'Hair porosity',field:'porosity',type:'single',
     options:['Low','Medium','High','Not Sure'],
     hint:'Porosity is how easily your hair absorbs and holds moisture.',
     notSureHelp:'Low porosity hair repels water and takes long to get wet. High porosity absorbs water quickly but loses it fast too. Medium porosity is in between.'},
    {label:'Hair elasticity',field:'elasticity',type:'single',
     options:['Low','Balanced','Not Sure'],
     hint:'Elasticity is how well your hair stretches and returns without breaking.',
     notSureHelp:'Stretch a wet strand. If it breaks straight away → low elasticity. If it stretches then returns → balanced. If it stretches but doesn\'t return → low elasticity with damage.'},
    {label:'Curl pattern',field:'texture',type:'single',
     options:['Wavy','Curly','Coily','Straight'],
     hint:'Your natural curl pattern when hair is healthy and undisturbed.',
     notSureHelp:'Wavy has a gentle S-shape. Curly has a defined S or spiral. Coily has tight coils or a Z-pattern.'},
    {label:'Scalp type',field:'scalp',type:'multi',
     options:['Normal','Dry','Sensitive','Oily'],
     hint:'Select all that apply.',
     notSureHelp:'Dry scalp feels tight or flaky. Sensitive reacts easily. Oily feels greasy within a day or two.'},
    {label:'Hair goals',field:'goals',type:'multi',
     options:['Length Retention','Definition','Low Frizz','Volume','Scalp Comfort'],
     hint:'What are you working towards right now?'},
    {label:'Current concerns',field:'issues',type:'multi',
     options:['Dryness','Breakage','Flaking','Tangles','None'],
     hint:'Optional — helps us surface relevant cautions.'},
  ];

  const canSave = f.porosity && f.elasticity && f.texture;

  return `
    ${navHTML('profile')}
    <div class="page">
      <div class="card" style="background:linear-gradient(135deg,var(--indigo),var(--mauve));color:#fff;border:none">
        <div style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;margin-bottom:6px">Your Crown Profile</div>
        <div style="font-size:13px;opacity:.85">Tell us about your hair so every score is personalised to you.</div>
      </div>
      <div class="alert alert-info">ℹ️ This app is for educational guidance only. It does not replace professional medical advice.</div>
      ${q.map(question=>{
        const val = f[question.field];
        const isMulti = question.type==='multi';
        const selectedArr = isMulti ? (Array.isArray(val) ? val : []) : [];
        return `
          <div class="card">
            <div class="card-title">${question.label}</div>
            ${question.hint ? `<div style="font-size:13px;color:var(--text2);margin-bottom:10px">${question.hint}</div>` : ''}

              }).join('')}
            </div>
            ${question.notSureHelp && (!val || val==='Not Sure') ? `<div class="form-hint" style="margin-top:10px">💡 ${question.notSureHelp}</div>` : ''}

      }).join('')}
      <button class="btn-primary" style="width:100%;justify-content:center;padding:15px" onclick="saveProfile()" ${!canSave?'disabled style="opacity:.5;cursor:not-allowed"':''}>

    </div>
    ${renderFooter()}`;
}

function selectPill(field, val, isMulti){
  if(!state.profile) state.profile = {};
  if(isMulti){
    let arr = Array.isArray(state.profile[field]) ? [...state.profile[field]] : [];
    const idx = arr.indexOf(val);
    if(idx>=0) arr.splice(idx,1); else arr.push(val);
    state.profile[field] = arr;
  } else {
    state.profile[field] = val;
  }
  const canSave = state.profile.porosity && state.profile.elasticity && state.profile.texture;
  // Re-render just profile to update UI without full page jump
  document.getElementById('app').innerHTML = renderProfile();
  bindEvents();
}

function saveProfile(){
  if(!state.profile||!state.profile.porosity||!state.profile.elasticity||!state.profile.texture) return;
  saveProfile_store();
  // Show confirmation
  const banner = document.createElement('div');
  banner.className='alert alert-success';
  banner.style='margin:16px;position:fixed;bottom:16px;left:16px;right:16px;z-index:999';
  banner.textContent='✅ Crown Profile saved! Your scores are now personalised.';
  document.body.appendChild(banner);
  setTimeout(()=>banner.remove(),3000);
}

function saveProfile_store(){
  try{localStorage.setItem('acc_profile',JSON.stringify(state.profile))}catch(e){}
}

function removePlanner(id){
  state.plannerItems = state.plannerItems.filter(p=>p.id!==id);
  savePlanner(); render();
}
function addToRoutine(plannerItemId, step){
  if(!step) return;
  const item = state.plannerItems.find(p=>p.id===plannerItemId);
  if(!item) return;
  const exists = state.routineItems.find(r=>r.plannerItemId===plannerItemId && r.step===step);
  if(!exists){
    state.routineItems.push({id:Date.now().toString(), plannerItemId, product_name:item.product_name, brand:item.brand, score:item.score, step, frequency:'', lastUsed:'', notes:''});
    saveRoutine();
  }
  go('routine');
}

// ============================================================
// ROUTINE
// ============================================================
const ROUTINE_STEPS = ['Pre-Wash','Cleanse','Condition','Deep Treatment','Leave-In','Moisturise','Seal','Style','Scalp Care','Clarify / Reset'];
function renderRoutine(){
  return `
    ${navHTML('routine')}
    <div class="page">
      <div class="card-title" style="font-size:1.4rem;margin-bottom:4px">Routine Builder</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:16px">Your personalised wash-day routine</div>
      ${state.routineItems.length===0 ? `<div class="alert alert-info">No products in your routine yet. Save products to your Planner and add them to a routine step.</div>` : ''}
      ${ROUTINE_STEPS.map((step,i)=>{
        const stepProducts = state.routineItems.filter(r=>r.step===step);
        const isOpen = state.openRoutineStep===step;
        return `<div class="routine-step">
          <div class="routine-step-head" onclick="toggleRoutineStep('${step}')">
            <div class="step-num">${i+1}</div>
            <div class="step-name">${step}</div>
            ${stepProducts.length ? `<div class="step-count">${stepProducts.length} product${stepProducts.length>1?'s':''}</div>` : ''}
            <div style="margin-left:auto;color:var(--text2);font-size:18px">${isOpen?'▲':'▼'}</div>
          </div>
          <div class="routine-step-body${isOpen?' open':''}">
            ${stepProducts.length===0 ? '<div style="font-size:13px;color:var(--text2);padding:8px 0">No products assigned yet. Use the Planner to add products to this step.</div>' : ''}
            ${stepProducts.map(rp=>{
              const tier = scoreTier(rp.score||50);
              return `<div class="routine-product">
                <div class="routine-product-name">${rp.product_name} <span style="color:${tier.color};font-size:12px">${rp.score}</span></div>
                <div class="routine-meta">${rp.brand||''}</div>
                <div style="display:flex;gap:8px;margin-top:8px">
                  <input type="text" placeholder="Frequency (e.g. weekly)" value="${rp.frequency||''}" style="flex:1;font-size:12px;padding:6px 10px" onchange="updateRoutineItem('${rp.id}','frequency',this.value)"/>
                  <input type="text" placeholder="Notes" value="${rp.notes||''}" style="flex:1;font-size:12px;padding:6px 10px" onchange="updateRoutineItem('${rp.id}','notes',this.value)"/>
                  <button onclick="removeRoutineItem('${rp.id}')" style="color:var(--text2);font-size:14px;padding:0 4px">×</button>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
    ${renderFooter()}`;
}

function toggleRoutineStep(step){ state.openRoutineStep = state.openRoutineStep===step?null:step; render(); }
function updateRoutineItem(id, field, val){ const r = state.routineItems.find(x=>x.id===id); if(r){ r[field]=val; saveRoutine(); } }
function removeRoutineItem(id){ state.routineItems=state.routineItems.filter(x=>x.id!==id); saveRoutine(); render(); }

// ============================================================
// COMPARE
// ============================================================
function renderCompare(){
  const items = state.plannerItems;
  if(items.length<2){
    return `${navHTML('compare')}<div class="page"><div class="alert alert-info">You need at least 2 saved products to compare. <button class="btn-primary btn-sm" onclick="go('scanner')">Scan a product</button></div></div>${renderFooter()}`;
  }
  const a = items[0], b = items[1];
  const tierA = scoreTier(a.score||50), tierB = scoreTier(b.score||50);
  return `
    ${navHTML('compare')}
    <div class="page">
      <div class="card-title" style="font-size:1.4rem;margin-bottom:16px">Compare Products</div>
      <div class="compare-grid">
        <div class="card">
          <div class="compare-score" style="background:${tierA.bg};color:${tierA.color}">${a.score||'?'}</div>
          <div style="font-weight:600;font-size:14px;margin-bottom:4px">${a.product_name}</div>
          <div style="font-size:12px;color:var(--mauve)">${a.brand||''}</div>
          <div style="font-size:12px;color:${tierA.color};font-weight:600;margin-top:8px">${tierA.tier}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px">${tierA.desc}</div>
        </div>
        <div class="card">
          <div class="compare-score" style="background:${tierB.bg};color:${tierB.color}">${b.score||'?'}</div>
          <div style="font-weight:600;font-size:14px;margin-bottom:4px">${b.product_name}</div>
          <div style="font-size:12px;color:var(--mauve)">${b.brand||''}</div>
          <div style="font-size:12px;color:${tierB.color};font-weight:600;margin-top:8px">${tierB.tier}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px">${tierB.desc}</div>
        </div>
      </div>
      <div class="alert ${a.score>b.score?'alert-success':'alert-info'}" style="margin-top:8px">
        ${a.score===b.score ? '⚖️ These products score equally for your profile.' :
          `👑 <strong>${a.score>b.score?a.product_name:b.product_name}</strong> scores higher for your hair profile (${Math.abs((a.score||0)-(b.score||0))} points difference).`}
      </div>
      <div style="font-size:13px;color:var(--text2);margin-top:8px">Comparing your two most recently saved products. Add more products to the Planner to compare different pairs.</div>
    </div>
    ${renderFooter()}`;
}

function renderBadges(){

// ============================================================
// GLOSSARY
// ============================================================
const GLOSSARY = [
  {term:'Porosity',def:'How easily your hair absorbs and retains moisture. Low porosity = tight cuticles, slow to absorb. High porosity = open cuticles, absorbs fast but loses moisture quickly.',tags:['Hair Profile','Foundation']},
  {term:'Elasticity',def:'How far your hair can stretch before breaking, and whether it returns to normal. Good elasticity means strong, healthy hair.',tags:['PETALS™','Foundation']},
  {term:'PETALS™ Method',def:'The proprietary multi-factor method developed by The Afro Curly Hair Coach and used to support personalised Crown Score™ analysis.',tags:['Framework']},
  {term:'Crown Score™',def:'A personalised 0–100 indicator designed to show how well a product may align with your current hair profile and needs.',tags:['Scoring']},
  {term:'Humectant',def:'Ingredients that attract and hold moisture from the air into the hair shaft. Examples: Glycerin, Panthenol, Aloe Vera.',tags:['Ingredient Type']},
  {term:'Emollient',def:'Ingredients that soften and smooth hair by filling gaps in the cuticle. Examples: Fatty alcohols, plant oils.',tags:['Ingredient Type']},
  {term:'Occlusive',def:'Ingredients that seal moisture in by forming a barrier. Examples: Petrolatum, Shea Butter, Mineral Oil.',tags:['Ingredient Type']},
  {term:'Protein',def:'Ingredients that strengthen the hair shaft by filling in damage. Best for high porosity or damaged hair. Examples: Hydrolysed Keratin, Wheat Protein.',tags:['Ingredient Type']},
  {term:'Surfactant',def:'Cleansing ingredients that remove dirt and oil. Gentle: Cocamidopropyl Betaine. Harsh: SLS, SLES.',tags:['Ingredient Type']},
  {term:'Silicone',def:'Synthetic polymers that coat the hair. Water-soluble (Cyclomethicone) = fine to use. Non-water-soluble (Dimethicone) = can build up and block moisture.',tags:['Ingredient Type','Watch List']},
  {term:'LOC Method',def:'Leave-in conditioner → Oil → Cream. A layering technique for sealing moisture into high porosity hair.',tags:['Technique']},
  {term:'LCO Method',def:'Leave-in conditioner → Cream → Oil. Often preferred for low porosity hair to prevent blockage.',tags:['Technique']},
  {term:'Clarifying',def:'Deep cleansing to remove product buildup. Important for low porosity hair and after heavy product use.',tags:['Technique']},
  {term:'Hygral Fatigue',def:'Damage caused by the hair swelling and shrinking repeatedly from water absorption. Common in high porosity hair with too many humectants.',tags:['Concern']},
  {term:'Protein-Moisture Balance',def:'Hair needs both protein (for strength) and moisture (for flexibility). Too much protein = brittle. Too much moisture = mushy.',tags:['Foundation']},
  {term:'INCI Name',def:'International Nomenclature of Cosmetic Ingredients — the standardised scientific names used on ingredient labels worldwide.',tags:['Labels']},
  {term:'pH Balance',def:'Hair\'s natural pH is 4.5–5.5 (slightly acidic). Products that are too alkaline raise the cuticle; too acidic can close it too tightly.',tags:['Hair Profile','Science']},
  {term:'Scalp Health',def:'The condition of the skin on your scalp — affects hair growth, product tolerance, and moisture levels. One of the factors considered within personalised hair and ingredient analysis.',tags:['Hair Profile']},
];

function renderGlossary(){
  const search = state.glossarySearch||'';
  const filtered = search ? GLOSSARY.filter(g=>g.term.toLowerCase().includes(search.toLowerCase())||g.def.toLowerCase().includes(search.toLowerCase())) : GLOSSARY;
  return `
    ${navHTML('glossary')}
    <div class="page">
      <div class="card-title" style="font-size:1.4rem;margin-bottom:16px">Ingredient Glossary</div>
      <input type="text" placeholder="Search terms..." value="${search}" oninput="state.glossarySearch=this.value;render()" style="margin-bottom:20px"/>
      ${filtered.map(g=>`
        <div class="glossary-item">
          <div class="glossary-term">${g.term}</div>
          ${g.tags.map(t=>`<span class="glossary-tag" style="background:var(--bg);color:var(--indigo);border:1px solid var(--border)">${t}</span>`).join('')}
          <div class="glossary-def">${g.def}</div>
        </div>`).join('')}
    </div>
    ${renderFooter()}`;
}
